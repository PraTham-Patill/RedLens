# Reddit Persona Analyzer Configuration
# =====================================

# API Configuration
[api]
# Delay between API requests (seconds) - be respectful to Reddit's servers
request_delay = 1.0

# Maximum number of posts/comments to fetch per user
max_items_limit = 100

# User agent string for requests
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# Analysis Configuration
[analysis]
# Minimum activity level thresholds
very_active_threshold = 100
active_threshold = 50
moderate_threshold = 20

# Communication style analysis
positive_words = ["great", "awesome", "love", "amazing", "excellent", "wonderful", "fantastic", "good", "nice", "perfect"]
negative_words = ["hate", "terrible", "awful", "horrible", "worst", "sucks", "annoying", "bad", "ugly", "stupid"]

informal_indicators = ["lol", "lmao", "wtf", "omg", "tbh", "imo", "btw", "idk", "ngl", "smh"]
formal_indicators = ["however", "therefore", "furthermore", "consequently", "nevertheless", "moreover", "accordingly"]

humor_indicators = ["lol", "haha", "funny", "joke", "hilarious", "/s", "sarcasm", "lmao", "rofl"]

# Output Configuration
[output]
# Include timestamps in output
include_timestamps = true

# Maximum number of citations per characteristic
max_citations_per_characteristic = 3

# Maximum number of interests to include
max_interests = 10

# Maximum number of top subreddits to show
max_top_subreddits = 5

# Logging Configuration
[logging]
# Log level (DEBUG, INFO, WARNING, ERROR)
log_level = "INFO"

# Log to file
log_to_file = true

# Log file name
log_file = "reddit_analyzer.log"
